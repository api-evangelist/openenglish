name: OpenEnglish
description: 'Open English is an online English-language learning company founded in 2007 and
  headquartered in Miami, serving primarily Latin American and Hispanic markets. It offers live,
  around-the-clock online classes with native-speaking teachers, self-paced interactive lessons,
  and mobile apps across consumer (B2C), business (Open English for Business), and children''s
  (Open English Junior) programs. Backed by Insight Partners and other growth investors, it operates
  a consumer education platform and does not publish a public developer API program; its public
  GitHub organization holds internal open-source engineering forks rather than client SDKs.'
